name: Bug 报告
description: 报告可复现的功能问题
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索是否已有同类 Issue，并移除所有真实密钥、完整对话与企业内网信息。
        安全漏洞请勿公开提交，见 [SECURITY.md](https://github.com/xuhongwang/ai-guard/blob/main/SECURITY.md)。

  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 简要说明发生了什么
      placeholder: 输入包含 xxx 时，期望……实际……
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 …
        2. 输入 …
        3. 观察到 …
    validations:
      required: true

  - type: input
    id: site
    attributes:
      label: 站点
      placeholder: https://chatgpt.com
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: 浏览器与版本
      placeholder: Chrome 140 / Firefox 142
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AI Guard 版本
      placeholder: 1.0.0（配置页或扩展管理页可见）
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 控制台日志或截图
      description: 请先删除敏感信息
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除真实密钥、完整对话与企业内网信息
          required: true
