name: 功能建议
description: 提出新功能或改进建议
title: '[Feature] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景与痛点，而不是直接给出实现方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: 影响范围
      description: 是否涉及新权限、站点适配、配置格式或隐私行为
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 该建议不依赖上传用户输入、远程配置或远程规则更新
          required: true
